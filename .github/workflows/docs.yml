name: Docs

# Builds the Blume docs site (apps/docs) and publishes it to GitHub Pages: https://kucukkanat.github.io/speech/
on:
  push:
    branches: [main]
    paths: ["apps/docs/**", "packages/**", ".github/workflows/docs.yml", "bun.lock"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but never cancels a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Blume's "last updated" dates come from git history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4 # Blume runs on Node 22.12+
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run docs:build
      - run: bun run --cwd apps/docs validate # broken links fail the deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
