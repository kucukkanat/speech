name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test # unit + integration, 100% coverage threshold
      - run: bun run build
      - run: bun run check:packages # publint + are-the-types-wrong
      - run: bun run docs:check # every README example typechecks
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:consumers # packed tarballs in a fresh Vite app, dev + production build
