name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4 # the docs site (Blume) builds on Node 22.12+
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test # unit + integration, 100% coverage threshold
      - run: bun run build # packages, Voice Lab and the docs site
      - run: bun run check:packages # publint + are-the-types-wrong
      - run: bun run docs:check # every README and docs-site example typechecks
      - run: bun run --cwd apps/docs validate # no broken links in the docs site
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:consumers # packed tarballs in a fresh app: Vite dev + build, esbuild, Bun.build, Bun's dev server
